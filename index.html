<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TASDIK CITY V7 ULTIMATE</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="rotate"><div class="rotateHint">📱↔️ Landscape recommended</div></div>
<div id="loading"><h1>TASDIK CITY</h1><b>V7 ULTIMATE</b><div class="bar"><i id="load"></i></div><small>Building city...</small></div>

<div id="hud">
 <div class="status"><span>❤️ <b id="hp">100</b></span><span>⚡ <b id="st">100</b></span><span>⭐ <b id="wanted">0</b></span><span>₹ <b id="cash">500</b></span></div>
 <div id="mission"><b id="missionTitle">CITY EXPLORER</b><div id="missionText">Reach the yellow marker.</div><small id="missionReward">Reward ₹50</small></div>
 <canvas id="map" width="180" height="180"></canvas>
 <div class="bottom"><span id="level">LV 1</span><span id="xp">XP 0/100</span><span id="vehicle">ON FOOT</span><span id="speed">0 KM/H</span></div>
</div>
<div id="toast"></div>
<div id="panel" class="panel hidden"></div>

<div id="controls">
 <div id="joy"><div id="knob"></div></div>
 <div class="buttons">
  <button id="jump">JUMP</button><button id="run">RUN</button>
  <button id="car">CAR</button><button id="interact">E</button>
  <button id="phone">📱</button>
 </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="game.js"></script>
</body>
</html>
